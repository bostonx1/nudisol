<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Descarga Nudisol</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e2426;
    color: #F5F1E8;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    padding-top: calc(40px + env(safe-area-inset-top));
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 28px;
    margin-bottom: 40px;
  }

  .sun-icon { width: 24px; height: 24px; }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.2;
    max-width: 320px;
    margin-bottom: 12px;
  }

  h1 .gold {
    font-style: italic;
    color: #F2C849;
  }

  p.subtitle {
    color: #cfd6d3;
    font-size: 16px;
    max-width: 300px;
    margin-bottom: 36px;
    line-height: 1.4;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(245,241,232,0.2);
    border-top-color: #F2C849;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 36px;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 280px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #F2C849;
    color: #0e2426;
    font-weight: 800;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 50px;
    text-decoration: none;
    transition: transform 0.15s ease;
  }

  .btn:active { transform: scale(0.97); }

  .btn.secondary {
    background: transparent;
    color: #F5F1E8;
    border: 1.5px solid rgba(245,241,232,0.35);
  }

  .domain {
    margin-top: 40px;
    color: #cfd6d3;
    font-size: 14px;
  }

  .badge-img {
    height: 58px;
    width: auto;
    display: block;
  }

  .app-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: block;
  }
</style>
</head>

  <script>
    // Enlaces base
    const APP_STORE_URL = "https://apps.apple.com/app/nudisol/id6801826841";
    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=app.nudisol.twa";

    // Propaga los parámetros UTM que traiga la propia URL de la bio,
    // o usa unos por defecto si no vienen especificados.
    const params = new URLSearchParams(window.location.search);
    const utmSource = params.get('utm_source') || 'instagram';
    const utmMedium = params.get('utm_medium') || 'bio';
    const utmCampaign = params.get('utm_campaign') || 'descarga_app';

    // Google Play sí soporta tracking real vía "referrer"
    const playUrl = `${PLAY_STORE_URL}&referrer=utm_source%3D${utmSource}%26utm_medium%3D${utmMedium}%26utm_campaign%3D${utmCampaign}`;
    // App Store no trackea UTM de forma nativa, se dejan solo por consistencia/registro propio
    const appStoreUrl = `${APP_STORE_URL}?utm_source=${utmSource}&utm_medium=${utmMedium}&utm_campaign=${utmCampaign}`;

    document.getElementById('btn-ios').href = appStoreUrl;
    document.getElementById('btn-android').href = playUrl;

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /android/i.test(ua);

    function redirect(url) {
      document.getElementById('spinner').style.display = 'block';
      setTimeout(() => { window.location.href = url; }, 400);
    }

    if (isIOS) {
      redirect(appStoreUrl);
    } else if (isAndroid) {
      redirect(playUrl);
    } else {
      // Desktop u otro dispositivo: mostramos ambos botones, sin redirigir solo
      document.querySelector('.subtitle').textContent = 'Elige tu tienda para descargar tu app de Nudisol:';
      document.getElementById('buttons').style.display = 'flex';
    }
